<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>页面不存在 - 拾光小筑</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css?v=2" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("blog-theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a class="header-logo" href="index.html">拾光<span>小筑</span></a>
      <nav class="header-nav">
        <a href="index.html">首页</a>
        <a href="archive.html">归档</a>
        <a href="about.html">关于</a>
        <button class="theme-toggle" aria-label="切换主题">🌙</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="notfound">
      <div class="notfound-code">404</div>
      <h1>这一页走丢了</h1>
      <p>你访问的页面不存在，可能已被移动或删除。</p>
      <a class="notfound-home" href="index.html">← 回到首页</a>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> 拾光小筑 · 用文字抵抗遗忘</p>
    </div>
  </footer>

  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
