  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css?v=2" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("blog-theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>

<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>

  <header class="header">
    <div class="container header-inner">
      <a class="header-logo" href="index.html">拾光<span>小筑</span></a>
      <nav class="header-nav">
        <a href="index.html">首页</a>
        <a href="archive.html">归档</a>
        <a href="about.html" class="active">关于</a>
        <button class="theme-toggle" aria-label="切换主题">🌙</button>
      </nav>
    </div>
  </header>

  <main class="about-page" id="main-content">
    <div class="about-card" id="about-card"></div>
    <div class="subscribe-box" id="subscribe-box">
      <h3>📬 邮件订阅</h3>
      <p>新文章发布时通知你，不打扰，可随时退订。</p>
      <form class="subscribe-form" id="subscribe-form">
        <input type="email" id="subscribe-email" placeholder="输入你的邮箱" required autocomplete="email" />
        <button type="submit">订阅</button>
      </form>
      <p class="subscribe-msg" id="subscribe-msg"></p>
    </div>
    <div class="contact-box" id="contact-box">
      <h3>💬 留言给我</h3>
      <p>有什么想说的？欢迎留言。</p>
      <form class="contact-form" id="contact-form">
        <input type="text" id="contact-name" placeholder="你的名字" required maxlength="30" />
        <input type="email" id="contact-email" placeholder="你的邮箱" required autocomplete="email" />
        <textarea id="contact-message" placeholder="想说的话…" rows="5" required minlength="10"></textarea>
        <button type="submit">发送留言</button>
      </form>
      <p class="contact-msg" id="contact-msg"></p>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-links">
        <a href="index.html">首页</a>
        <a href="archive.html">归档</a>
        <a href="about.html">关于</a>
        <a href="feed.xml">RSS</a>
        <a href="#" id="footer-repo" hidden>GitHub</a>
      </div>
      <p>© <span id="year"></span> 拾光小筑 · 用文字抵抗遗忘</p>
    </div>
  </footer>

  <button class="back-top" aria-label="返回顶部">↑</button>

  <script src="js/data.js?v=2" defer></script>
  <script src="js/app.js?v=2" defer></script>
</body>
</html>
